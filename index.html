<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Van der Valk Hotels NL</title><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'><script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><style>:root{--blue:#0f2f57;--gold:#c9a35b;--bg:#f5f1ea}*{box-sizing:border-box}html,body,#map{height:100%;margin:0;font-family:Inter,Arial,sans-serif}#map{z-index:1}.panel{position:absolute;z-index:999;top:16px;left:16px;width:min(420px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:hidden;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-radius:22px;box-shadow:0 18px 55px #0004}.hero{height:145px;background:linear-gradient(135deg,#0f2f57cc,#11182788),url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=900&q=80') center/cover;color:white;padding:18px}.hero h1{margin:0;font-size:25px;line-height:1.05}.hero p{margin:8px 0 0;font-size:13px;opacity:.92}.controls{padding:14px;background:var(--bg);display:grid;grid-template-columns:1fr 1fr;gap:9px}.controls input,.controls select{width:100%;padding:10px;border:1px solid #ddd;border-radius:12px;background:white}.controls .full{grid-column:1/-1}.list{padding:12px;max-height:48vh;overflow:auto;background:white}.card{display:grid;grid-template-columns:86px 1fr;gap:11px;width:100%;text-align:left;border:1px solid #eee;border-radius:16px;background:white;padding:9px;margin-bottom:10px;box-shadow:0 3px 14px #0000000d;cursor:pointer}.card:hover{border-color:var(--gold);transform:translateY(-1px)}.thumb{height:78px;border-radius:12px;background:linear-gradient(135deg,#d8c6a6,#0f2f57);background-image:url('https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?auto=format&fit=crop&w=300&q=70');background-size:cover;background-position:center}.card b{display:block;color:var(--blue);font-size:14px}.meta{display:block;color:#666;font-size:12px;margin:3px 0 7px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;background:#f3eadb;color:#6b4e16;padding:4px 7px;border-radius:999px}.leaflet-popup-content{font-family:Arial;min-width:220px}.btn{display:inline-block;margin-top:8px;margin-right:5px;padding:8px 10px;border-radius:10px;background:var(--blue);color:white!important;text-decoration:none;font-weight:700}.btn.alt{background:var(--gold);color:#221!important}@media(max-width:650px){.panel{left:8px;right:8px;top:8px;width:auto}.hero{height:120px}.list{max-height:38vh}}</style></head><body><div id='map'></div><aside class='panel'><div class='hero'><h1>Van der Valk Hotels</h1><p>Netherlands map with date search, booking links and directions.</p></div><div class='controls'><input id='q' class='full' placeholder='Search hotel or city'><input id='ci' type='date'><input id='co' type='date'><select id='gu'><option value='1'>1 guest</option><option value='2' selected>2 guests</option><option value='3'>3 guests</option><option value='4'>4 guests</option></select><select id='prov'><option value=''>All provinces</option></select></div><div id='list' class='list'></div></aside><script>const H=[['Akersloot','North Holland',52.56,4.73],['Almere','Flevoland',52.3508,5.2647],['Almelo','Overijssel',52.3567,6.6625],['Amersfoort A1','Utrecht',52.1561,5.3878],['Amsterdam-Amstel','North Holland',52.335,4.915],['Apeldoorn - de Cantharel','Gelderland',52.2112,5.9699],['Arnhem','Gelderland',51.9851,5.8987],['Assen','Drenthe',52.9928,6.5642],['Avifauna Alphen aan den Rijn','South Holland',52.1292,4.6555],['Breda','North Brabant',51.5719,4.7683],['Breukelen','Utrecht',52.174,5.001],['Delft A4','South Holland',52.0116,4.3571],['Deventer','Overijssel',52.255,6.1639],['Dordrecht','South Holland',51.8133,4.6901],['Drachten','Friesland',53.1125,6.0989],['Eindhoven','North Brabant',51.4416,5.4697],['Enschede','Overijssel',52.2215,6.8937],['Gorinchem','South Holland',51.8365,4.9724],['Haarlem','North Holland',52.3874,4.6462],['Heerlen','Limburg',50.8882,5.9795],['Leiden','South Holland',52.1601,4.497],['Maastricht','Limburg',50.8514,5.691],['Middelburg','Zeeland',51.4988,3.61],['Nijmegen-Lent','Gelderland',51.842,5.852],['Oostzaan - Amsterdam','North Holland',52.44,4.875],['Rotterdam-Blijdorp','South Holland',51.935,4.448],['Schiphol','North Holland',52.306,4.69],['Tilburg','North Brabant',51.5555,5.0913],['Utrecht','Utrecht',52.08,5.12],['Venlo','Limburg',51.3704,6.1724],['Zwolle','Overijssel',52.5168,6.083]];function pad(n){return String(n).padStart(2,'0')}let t=new Date(),tm=new Date(Date.now()+86400000);ci.value=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());co.value=tm.getFullYear()+'-'+pad(tm.getMonth()+1)+'-'+pad(tm.getDate());[...new Set(H.map(x=>x[1]))].sort().forEach(p=>prov.innerHTML+=`<option>${p}</option>`);const map=L.map('map').setView([52.1,5.3],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const group=L.featureGroup().addTo(map),ms=[];function hotel(n){return 'Van der Valk Hotel '+n}function gmaps(n){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(hotel(n)+', Netherlands')}function dir(n){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(hotel(n)+', Netherlands')}function price(n){let q=hotel(n)+' '+ci.value+' '+co.value+' '+gu.value+' guests';return 'https://www.google.com/search?q='+encodeURIComponent(q+' book room availability price')}H.forEach(x=>{const pop=`<b>${hotel(x[0])}</b><br>${x[1]}<br><a class=btn target=_blank href='${price(x[0])}'>Check live price</a><a class='btn alt' target=_blank href='${dir(x[0])}'>Directions</a>`;const m=L.marker([x[2],x[3]]).bindPopup(pop).addTo(group);m.d=x;ms.push(m)});map.fitBounds(group.getBounds().pad(.08));function render(){let s=q.value.toLowerCase(),p=prov.value;list.innerHTML='';ms.forEach(m=>{let x=m.d,name=hotel(x[0]);let show=(!s||(name+' '+x[1]).toLowerCase().includes(s))&&(!p||x[1]==p);m[show?'addTo':'removeFrom'](group);if(show){let b=document.createElement('button');b.className='card';b.innerHTML=`<span class=thumb></span><span><b>${name}</b><span class=meta>${x[1]}</span><span class=chips><span class=chip>Check live availability</span><span class=chip>${gu.value} guests</span></span></span>`;b.onclick=()=>{map.setView(m.getLatLng(),12);m.setPopupContent(`<b>${name}</b><br>${x[1]}<br><a class=btn target=_blank href='${price(x[0])}'>Check live price</a><a class='btn alt' target=_blank href='${gmaps(x[0])}'>Google Maps</a>`);m.openPopup()};list.appendChild(b)}})}[q,ci,co,gu,prov].forEach(e=>e.oninput=render);render();</script></body></html>
