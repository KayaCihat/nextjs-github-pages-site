name: Deploy static Next.js app to GitHub Pages

on:
  # Run this workflow on every push to the main branch. You can also trigger it
  # manually via the GitHub Actions UI by uncommenting `workflow_dispatch`.
  push:
    branches: [main]
  # workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # The BASE_PATH environment variable is used inside next.config.ts to
      # prefix assets and links with the repository name. This ensures your
      # application works correctly when hosted on GitHub Pages under a
      # subdirectory【466501155991259†L319-L455】.
      - name: Extract repository name
        run: echo "BASE_PATH=/$(echo $GITHUB_REPOSITORY | cut -d '/' -f 2)" >> $GITHUB_ENV

      - name: Build Next.js app
        run: npm run build && touch ./out/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: public
          folder: out
          # Use the built-in GitHub token to push to the public branch.
          token: ${{ secrets.GITHUB_TOKEN }}